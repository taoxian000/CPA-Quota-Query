name: Build Windows AMD64

on:
  push:
    tags:
      - "**"

# Tests and the build run with a read-only token; only the release job can write.
permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Build Windows AMD64 executable
        run: go build -trimpath "-ldflags=-H=windowsgui -X main.appVersion=$env:APP_VERSION" -o "quota-monitor-$($env:APP_VERSION).exe" .
        env:
          GOOS: windows
          GOARCH: amd64
          APP_VERSION: ${{ github.ref_name }}

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quota-monitor-${{ github.ref_name }}
          path: quota-monitor-${{ github.ref_name }}.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: windows-amd64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: quota-monitor-${{ github.ref_name }}

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          if ($env:APP_VERSION -notmatch '^v\d+\.\d+(?:\.\d+)?$') {
            Write-Host "Tag is not a supported stable version; skipping Release."
            exit 0
          }
          gh release view $env:APP_VERSION *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:APP_VERSION ".\quota-monitor-$($env:APP_VERSION).exe" --clobber
          } else {
            gh release create $env:APP_VERSION ".\quota-monitor-$($env:APP_VERSION).exe" --verify-tag --generate-notes --title $env:APP_VERSION
          }
